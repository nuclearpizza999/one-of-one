<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add to board, icon variant</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&amp;family=EB+Garamond:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000;text-decoration:none}a:hover{color:#555555}
</style>
<style>body{background:#777;display:flex;justify-content:center;padding:40px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="display: flex; justify-content: center; padding-bottom: 20px; opacity: 0.25">
    <figure style="margin: 0; width: 230px; box-sizing: border-box; background: #ffffff; border: 1px solid #e6e6e6; box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 12px 12px 0; display: flex; flex-direction: column">
      <img src="assets/seoul.jpg" alt="Street in Seoul" style="display: block; width: 204px; height: 261px; object-fit: cover">
      <figcaption style="height: 44px; box-sizing: border-box; padding: 0 7px 8px; display: flex; justify-content: space-between; align-items: flex-end; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 8px; font-weight: 600; line-height: 1.32; color: #111111">
        <div style="display: flex; flex-direction: column"><span>Seoul, South Korea</span><span>July 1st, 2026</span><span style="font-weight: 400; color: #333333">37.5563° N, 126.9236° E</span></div>
      </figcaption>
    </figure>
  </div>

  <section style="border-top: 1px solid #000000; background: #ffffff; display: flex; flex-direction: column">
    <div style="height: 48px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; padding: 0 16px 0 20px; border-bottom: 1px solid #000000">
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em">1/1</span>
      <a href="1-make-light.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 20px; border-bottom: 1px solid #000000">
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Seoul, South Korea</span>
      <span style="font-size: 30px; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">#3</span>
    </div>

    <div style="padding: 20px 20px 0; display: flex; align-items: center; gap: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" aria-label="Location shown as" role="img"><path d="M12 21.5s-7-5.8-7-11.5a7 7 0 0 1 14 0c0 5.7-7 11.5-7 11.5z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <div style="flex: 1 1 0; display: flex; border: 1px solid #000000">
        <label style="flex: 1 1 0; position: relative; display: flex; align-items: center; justify-content: center; height: 44px; background: #000000; color: #ffffff; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer"><input type="radio" name="precision" value="neighborhood" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Area</label>
        <label style="flex: 1 1 0; position: relative; display: flex; align-items: center; justify-content: center; height: 44px; border-left: 1px solid #000000; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer"><input type="radio" name="precision" value="city" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">City</label>
      </div>
    </div>


    <div style="padding: 24px 20px 40px">
      <a href="3-board-light.html" aria-label="Add to board" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #000000">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7"></rect><rect x="13.5" y="3.5" width="7" height="7"></rect><rect x="3.5" y="13.5" width="7" height="7"></rect><path d="M17 14v7M13.5 17.5h7"></path></svg>
      </a>
    </div>
  </section>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make a card, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&amp;family=EB+Garamond:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff;text-decoration:none}a:hover{color:#bbbbbb}
</style>
<style>body{background:#777;display:flex;justify-content:center;padding:40px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding-top: 54px">
  <div style="height: 48px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; padding: 0 16px 0 20px; border-bottom: 1px solid #ffffff">
    <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em">1/1</span>
    <a href="3-board-dark.html" aria-label="Cancel" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="display: flex; justify-content: center; padding: 36px 20px 28px">
    <figure style="margin: 0; width: 310px; box-sizing: border-box; background: #ffffff; border: 1px solid #e6e6e6; box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 16px 16px 0; display: flex; flex-direction: column">
      <img src="assets/seoul.jpg" alt="Street in Seoul" style="display: block; width: 276px; height: 354px; object-fit: cover">
      <figcaption style="height: 60px; box-sizing: border-box; padding: 0 9px 11px; display: flex; justify-content: space-between; align-items: flex-end; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; font-weight: 600; line-height: 1.32; color: #111111">
        <div style="display: flex; flex-direction: column"><span>Seoul, South Korea</span><span>July 1st, 2026</span><span style="font-weight: 400; color: #333333">37.5563° N, 126.9236° E</span></div>
        <span style="color: #9a9a9a">#</span>
      </figcaption>
    </figure>
  </div>

  <div style="padding: 0 20px">
    <div style="display: flex; border: 1px solid #ffffff">
      <button type="button" aria-label="Replay intro" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 52px; background: none; border: 0; padding: 0; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8"></path><path d="M4 3v5h5"></path></svg>
      </button>
      <a href="2-add-to-board-dark.html" aria-label="Add to board" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 52px; background: #ffffff; border-left: 1px solid #ffffff">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7"></rect><rect x="13.5" y="3.5" width="7" height="7"></rect><rect x="3.5" y="13.5" width="7" height="7"></rect><path d="M17 14v7M13.5 17.5h7"></path></svg>
      </a>
      <a href="6-print-dark.html" aria-label="Print" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 52px; border-left: 1px solid #ffffff">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3.5h10V9"></path><rect x="3.5" y="9" width="17" height="7.5"></rect><path d="M7 16.5v4h10v-4"></path></svg>
      </a>
    </div>
  </div>

  <nav style="margin-top: auto; height: 84px; box-sizing: border-box; border-top: 1px solid #ffffff; background: #000000; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
    <a href="3-board-dark.html" aria-label="Board" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8d8d8d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7"></rect><rect x="13.5" y="3.5" width="7" height="7"></rect><rect x="3.5" y="13.5" width="7" height="7"></rect><rect x="13.5" y="13.5" width="7" height="7"></rect></svg>
    </a>
    <div style="width: 48px; height: 44px"></div>
    <a href="1-make-dark.html" aria-label="Make" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 44px; border-bottom: 1px solid #ffffff;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </nav>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&amp;family=EB+Garamond:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000;text-decoration:none}a:hover{color:#555555}
</style>
<style>body{background:#777;display:flex;justify-content:center;padding:40px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding-top: 54px; overflow: hidden">
  <div style="height: 48px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; padding: 0 16px 0 20px; border-bottom: 1px solid #000000">
    <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em">1/1</span>
    <a href="3-board-light.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 18px 20px 14px">
    <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Seoul, July</span>
    <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.1em; color: #6b6b6b">6</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, 128px); justify-content: space-between; gap: 2px 0">
    <a href="1-make-light.html" style="display: block; width: 128px; height: 128px; overflow: hidden"><img src="assets/seoul.jpg" alt="Seoul, South Korea" style="display: block; width: 128px; height: 128px; object-fit: cover"></a>
    <a href="1-make-light.html" style="display: block; width: 128px; height: 128px; overflow: hidden"><img src="assets/sky.jpg" alt="Seoul, South Korea" style="display: block; width: 128px; height: 128px; object-fit: cover"></a>
    <a href="1-make-light.html" style="display: block; width: 128px; height: 128px; overflow: hidden"><img src="assets/road.jpg" alt="Seoul, South Korea" style="display: block; width: 128px; height: 128px; object-fit: cover"></a>
    <a href="1-make-light.html" style="display: block; width: 128px; height: 128px; overflow: hidden"><img src="assets/dress.jpg" alt="Seoul, South Korea" style="display: block; width: 128px; height: 128px; object-fit: cover"></a>
    <a href="1-make-light.html" style="display: block; width: 128px; height: 128px; overflow: hidden"><img src="assets/green.jpg" alt="Seoul, South Korea" style="display: block; width: 128px; height: 128px; object-fit: cover"></a>
    <a href="1-make-light.html" style="display: block; width: 128px; height: 128px; overflow: hidden"><img src="assets/walker.jpg" alt="Seoul, South Korea" style="display: block; width: 128px; height: 128px; object-fit: cover"></a>
  </div>
  <div style="display: flex; border: 1px solid #000000; margin: 18px 20px 0">
    <a href="1-make-light.html" aria-label="Add cards" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 48px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="5-shared-card-light.html" aria-label="Copy share link" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 48px; background: #000000; border-left: 1px solid #000000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.3 1.3"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.3-1.3"></path></svg></a>
  </div>

  <nav style="margin-top: auto; height: 84px; box-sizing: border-box; border-top: 1px solid #000000; background: #ffffff; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
    <a href="3-board-light.html" aria-label="Board" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 44px; border-bottom: 1px solid #000000;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7"></rect><rect x="13.5" y="3.5" width="7" height="7"></rect><rect x="3.5" y="13.5" width="7" height="7"></rect><rect x="13.5" y="13.5" width="7" height="7"></rect></svg>
    </a>
    <div style="width: 48px; height: 44px"></div>
    <a href="1-make-light.html" aria-label="Make" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </nav>
</div>
</body>
</html>

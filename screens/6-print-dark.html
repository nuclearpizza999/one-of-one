<!doctype html>

<style>

</style>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding-top: 54px; overflow: hidden">

    <span style="font-size: 16px; font-weight: 500">[PRICE]</span>
  </div>
  <div style="padding: 14px 20px 0">
    <a href="3-board-dark.html" aria-label="Order print" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #ffffff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></a>

    <a href="1-make-dark.html" aria-label="Make" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8d8d8d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
